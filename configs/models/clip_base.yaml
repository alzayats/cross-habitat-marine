# CLIP ViT-Base/16 Configuration
model:
  name: "clip_base"
  family: "clip"
  architecture: "vit_base"
  source: "open_clip"
  clip_model_name: "ViT-B-16"
  clip_pretrained: "openai"
  hf_model_id: "openai/clip-vit-base-patch16"
  patch_size: 16
  embed_dim: 768
  num_heads: 12
  num_layers: 12
  image_size: 224
  use_registers: false
  feature_dim: 512  # CLIP projects to 512
  feature_extraction: "cls_token"
  pretrained: true
  lora_target_modules: ["q_proj", "v_proj"]
  attention_module_pattern: "attn"
  # Zero-shot text prompts for marine species
  zero_shot_templates:
    - "a photo of a {species} fish"
    - "an underwater photo of a {species}"
    - "a marine photograph of a {species} fish"
    - "a blurry underwater image of a {species}"
