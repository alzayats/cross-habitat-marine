# Linear Probing Adaptation Configuration
adaptation:
  name: "linear_probe"
  type: "linear_probe"
  freeze_backbone: true
  head_type: "linear"  # linear or mlp
  learning_rate: 1.0e-3
  weight_decay: 0.0
  epochs: 50
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_fraction: 0.05
  early_stopping_patience: 10
  label_smoothing: 0.0
