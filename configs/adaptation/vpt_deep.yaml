# Visual Prompt Tuning (Deep) Adaptation Configuration
adaptation:
  name: "vpt_deep"
  type: "vpt"
  freeze_backbone: true
  head_type: "linear"
  vpt_mode: "deep"  # deep or shallow
  num_prompt_tokens: 10
  prompt_dropout: 0.1
  learning_rate: 1.0e-4
  weight_decay: 0.05
  epochs: 30
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_fraction: 0.05
  early_stopping_patience: 10
  label_smoothing: 0.0
