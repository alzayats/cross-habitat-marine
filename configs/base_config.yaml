# =============================================================================
# Cross-Habitat Marine Species Recognition - Base Configuration
# =============================================================================

project:
  name: "cross-habitat-marine-vfm"
  description: "Cross-habitat marine species recognition using vision foundation models"
  wandb_project: "cross-habitat-marine"
  wandb_entity: null  # Set to your WandB username
  use_wandb: false
  output_dir: "./outputs"
  checkpoint_dir: "./outputs/checkpoints"
  results_dir: "./outputs/results"
  figures_dir: "./outputs/figures"
  features_dir: "./outputs/features"
  log_dir: "./outputs/logs"

seeds: [42, 123, 456]
fewshot_trials: 5
fewshot_k_values: [0, 1, 2, 5, 10, 20, 50, 100]

data:
  root_dir: "./datasets"  # Path to downloaded datasets (see data/download_datasets.sh)
  image_size: 224
  image_size_large: 518  # For DINOv2 large with registers
  batch_size: 64
  batch_size_detection: 8
  num_workers: 2
  pin_memory: true
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]
  val_split: 0.1

training:
  mixed_precision: true
  gradient_clip_max_norm: 1.0
  gradient_accumulation_steps: 1
  log_every_n_steps: 10

hardware:
  device: "cuda"
  multi_gpu: false  # Set true for DataParallel
  num_gpus: 1

cross_dataset:
  strategies: ["intersection", "taxonomic", "open_set"]
  # intersection: Use only overlapping species
  # taxonomic: Map to family-level groups
  # open_set: Feature similarity based recognition

statistical:
  n_seeds: 3
  n_fewshot_trials: 5
  significance_test: "wilcoxon"
  confidence_level: 0.95
